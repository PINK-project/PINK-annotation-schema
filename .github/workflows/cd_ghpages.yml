name: Deploy on GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-on-ghpages:
    #concurrency: ci-${{ github.ref }}  # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install EMMOntoPy, tripper and markdown converter
      run: |
        pip install --upgrade pip
        pip install \
            "EMMOntoPy[ontodoc,ontokit] @ git+https://github.com/emmo-repo/EMMOntoPy.git@ontokit_dev" \
            "tripper[datadoc] @ git+https://github.com/EMMC-ASBL/tripper.git@master" \
            markdown

    - name: Generate documentation
      run: |
        mkdir -p public
        python - <<'PY'
        from pathlib import Path
        import markdown

        readme = Path("README.md").read_text(encoding="utf-8")
        body = markdown.markdown(
            readme,
            extensions=["extra", "tables", "fenced_code", "toc"],
        )

        html = f"""<!doctype html>
<html lang=\"en\">
  <head>
    <meta charset=\"utf-8\" />
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
    <title>PINK annotation schema</title>
    <style>
      :root {{
        color-scheme: light;
      }}
      body {{
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
        color: #1f2937;
        background: #f8fafc;
      }}
      main {{
        max-width: 960px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }}
      h1, h2, h3 {{
        line-height: 1.25;
        color: #0f172a;
      }}
      code {{
        background: #e2e8f0;
        padding: 0.12rem 0.3rem;
        border-radius: 0.25rem;
      }}
      pre code {{
        display: block;
        padding: 0.9rem;
        overflow-x: auto;
      }}
      a {{
        color: #0b5ed7;
      }}
      table {{
        border-collapse: collapse;
      }}
      th, td {{
        border: 1px solid #cbd5e1;
        padding: 0.4rem 0.6rem;
      }}
    </style>
  </head>
  <body>
    <main>
      {body}
    </main>
  </body>
</html>
"""

        Path("public/index.html").write_text(html, encoding="utf-8")
        Path("public/.nojekyll").write_text("", encoding="utf-8")
        PY


    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public
        branch: gh-pages
        clean: true
        single-commit: true
